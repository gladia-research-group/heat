defaults:
  - _self_

name: "meta-llama/Llama-3.1-8B"
block_size: 128000
vocab_size: 128256  
batch_size: 5
data_dtype: "uint16"   
ponder_p_start: ${prior.p_start}
ponder_p_end: ${prior.p_end}
act_threshold: 10.0

instance:
  _target_: transformers.AutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ${model.name}
  device_map: null
  torch_dtype: "auto"
  trust_remote_code: False
  attn_implementation: "eager"

surgery:
  norm: true
  activation: true 
  attention: true

freeze:
  embeddings: false  
  lm_head: false 