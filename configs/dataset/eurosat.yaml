name: EuroSAT
num_classes: 10
ft_epochs: 14
val_split: test   # HF split name used as validation

hf_dataset:
  _target_: datasets.load_dataset
  path: tanganke/eurosat
  token: ${oc.env:HF_TOKEN}

get_batch:
  _target_: he_aware_training.utils.train.compose_get_hf_image_batch
  cfg: ???
  device: ${device}
  micro_batch: ${trainer.batch_size}
  train_transform: ${dataset.train_transform}
  val_transform: ${dataset.val_transform}

image_size: 384 

train_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.RandomResizedCrop
      size: ${dataset.image_size}
      scale: [0.6, 1.0]
      ratio: [0.75, 1.333]
    - _target_: torchvision.transforms.RandomHorizontalFlip
    - _target_: torchvision.transforms.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: torchvision.transforms.RandomErasing
      p: 0.25

val_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.Resize
      size:
        - ${dataset.image_size}
        - ${dataset.image_size}
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
data_object:
  _target_: he_aware_training.dataset.image_dataset.StreamingImageDataset
  _recursive_: False
  dataset_cfg:
    _target_: datasets.load_dataset
    path: tanganke/eurosat
  processor:
    _target_: transformers.ViTImageProcessor.from_pretrained
    pretrained_model_name_or_path: ${model.name}
  split: ???
