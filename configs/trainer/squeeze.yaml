batch_size: ${model.batch_size}
target_tokens_per_update: 131072
max_iters: 50000
eval_iters: 200
log_interval: 1
eval_interval: 250
learning_rate: 1e-4 
min_lr: 5e-5
warmup_iters: 1000 
warmup_on_resume: 0
weight_decay: 0.0
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
compile: true
resume_from: null

distill: false
distill_temperature: 1.0

score_cap_threshold: 0.0
score_cap_strength: 0.1
score_cap_threshold_start: null
score_cap_anneal_iters: 0

disable_student_dropout: true

regularizer:
  _target_: he_aware_training.utils.loss.ActivationRegularizer
  model: ???
  layers:
    - ln_1
    - ln_2
    - ln_f
    - act
  threshold: 10.0
  lambda_reg: 1e-3
  start_step: 0
  log_interval: ${trainer.log_interval}

optimizer:
  _target_: torch.optim.AdamW
  lr: ${trainer.learning_rate}
  betas: [0.9, 0.99]
  weight_decay: ${trainer.weight_decay}
  eps: 1e-10