[project]
name = "he-aware-training"
version = "0.1.0"
description = "HE aware training to speed up downstream encrypted inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "torchvision>=0.25.0",
    "transformers>=4.57.6",
    "timm>=1.0.0",
    "wandb>=0.25.0",
    "dotenv>=0.9.9",
    "scipy>=1.17.1",
    "pybind11>=3.0.2",
    "huggingface-hub>=1.5.0",
    "pytest>=9.0.2",
    "pybind11-stubgen>=2.5.5",
    "datasets>=4.6.1",
    "lm-eval>=0.4.5",
    "accelerate>=1.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.10.9",
]

[project.scripts]
prepare_data = "he_aware_training.scripts.prepare_data:main"
prepare_image = "he_aware_training.scripts.prepare_image_data:main"
eval_vit = "he_aware_training.scripts.evaluate_vit:main"
eval_vit_pretrained = "he_aware_training.scripts.evaluate_vit_pretrained:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
]
